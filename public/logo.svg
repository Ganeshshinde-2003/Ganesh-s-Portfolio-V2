  <!-- Small pins -->
  <circle cx="14" cy="8" r="1" fill="#22C55E" />
  <circle cx="30" cy="8" r="1" fill="#22C55E" />
  <circle cx="14" cy="36" r="1" fill="#22C55E" />
  <circle cx="30" cy="36" r="1" fill="#22C55E" />

  <!-- GS text -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="600" fill="#E5E7EB">
    GS
